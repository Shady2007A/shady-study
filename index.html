<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>مذاكرة – Eng: Shady Ashraf</title>

    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      /* #CSS_COLORS */
      :root {
        color-scheme: dark;
        --bg: #0a1120;
        --s1: #101a30;
        --s2: #16233f;
        --bd: #1f3358;
        --ac: #3b82f6;
        --sky: #7dd3fc;
        --tx: #e6edf7;
        --mu: #8da2c4;
        --err: #f87171;
        --ok: #4ade80;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* #CSS_LAYOUT */
      * {
        box-sizing: border-box;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
        line-height: 1.6;
      }
      .w {
        max-width: 900px;
        margin: auto;
        padding: 14px;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: 18px;
        padding: 14px;
        position: relative;
      }
      #ph {
        width: 78px;
        height: 78px;
        border-radius: 50%;
        object-fit: cover;
        border: 3px solid var(--ac);
        cursor: pointer;
      }
      h1 {
        font-size: 19px;
        margin: 0;
      }
      .mu {
        color: var(--mu);
        font-size: 13px;
      }
      .cd {
        margin: 14px 0;
        background: linear-gradient(135deg, #12305e, #0e2244);
        border: 1px solid var(--bd);
        border-radius: 18px;
        padding: 16px;
        text-align: center;
      }
      .cd b {
        display: block;
        font-size: 30px;
        color: var(--sky);
        direction: ltr;
        letter-spacing: 1px;
      }
      nav {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      nav button,
      .b {
        background: var(--s2);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 9px 14px;
        font: inherit;
        cursor: pointer;
      }
      nav button {
        flex: 1;
      }
      nav button.on,
      .b.p {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .c {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .c.t {
        border-color: var(--sky);
      }
      h3 {
        margin: 0 0 8px;
        font-size: 16px;
        color: var(--sky);
      }
      .r {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        border-top: 1px solid var(--bd);
        flex-wrap: wrap;
      }
      .r:first-of-type {
        border-top: 0;
      }
      .r .g {
        flex: 1;
        min-width: 120px;
      }
      .done {
        color: var(--mu);
        text-decoration: line-through;
      }
      input,
      select,
      textarea {
        background: var(--bg);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 8px;
        font: inherit;
        max-width: 100%;
      }
      textarea {
        width: 100%;
        min-height: 80px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .sb {
        background: var(--s2);
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 14px;
        cursor: pointer;
        direction: ltr;
        text-align: left;
      }
      .sb:hover {
        border-color: var(--ac);
      }
      .fi {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid var(--bd);
        direction: ltr;
      }
      .fi span {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      a {
        color: var(--sky);
      }
      .tblwrap {
        overflow-x: auto;
        width: 100%;
      }
      .dtbl {
        width: 100%;
        border-collapse: collapse;
        min-width: 560px;
      }
      .dtbl th,
      .dtbl td {
        border: 1px solid var(--bd);
        padding: 8px;
        text-align: right;
        vertical-align: top;
      }
      .dtbl th {
        background: var(--s2);
        color: var(--sky);
      }
      .dtbl td {
        overflow-wrap: anywhere;
      }
      .taskrow {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 10px 0;
        border-top: 1px solid var(--bd);
      }
      .taskrow:first-of-type {
        border-top: 0;
      }
      .taskrow .tasktext {
        flex: 1;
        overflow-wrap: anywhere;
      }
      .taskrow .tasktext.done {
        text-decoration: line-through;
        color: var(--mu);
      }
      .sectionhint {
        color: var(--mu);
        font-size: 12px;
        margin: 0 0 8px;
      }
      #m {
        position: fixed;
        inset: 0;
        background: rgba(5, 9, 18, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 99;
        padding: 14px;
        flex-direction: column;
        gap: 10px;
      }
      #m img,
      #m video,
      #m iframe {
        max-width: 100%;
        max-height: 82vh;
        border-radius: 12px;
        background: #000;
      }
      #m iframe {
        width: 100%;
        height: 82vh;
      }
      .x {
        color: #ff9db0;
        background: none;
        border: 0;
        cursor: pointer;
        font-size: 18px;
      }

      /* Cloud & Auth UI Styling */
      .sync-status {
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 8px;
        display: inline-block;
        margin-top: 4px;
        font-weight: bold;
      }
      .sync-status.synced {
        background: rgba(74, 222, 128, 0.15);
        color: var(--ok);
        border: 1px solid var(--ok);
      }
      .sync-status.syncing {
        background: rgba(125, 211, 252, 0.15);
        color: var(--sky);
        border: 1px solid var(--sky);
      }
      .sync-status.error {
        background: rgba(248, 113, 113, 0.15);
        color: var(--err);
        border: 1px solid var(--err);
      }

      .auth-modal {
        position: fixed;
        inset: 0;
        background: rgba(10, 17, 32, 0.96);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        padding: 14px;
      }
      .auth-card {
        background: var(--s1);
        border: 1px solid var(--bd);
        border-radius: 18px;
        padding: 24px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }
      .auth-card h2 {
        margin: 0 0 16px;
        color: var(--sky);
        font-size: 20px;
        text-align: center;
      }
      .auth-card form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .auth-card input {
        width: 100%;
      }
      .auth-err {
        color: var(--err);
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>

  <body>
    <!-- Auth Screen Overlay -->
    <div id="authOverlay" class="auth-modal" style="display: none">
      <div class="auth-card">
        <h2>تسجيل الدخول / إنشاء حساب</h2>
        <form onsubmit="handleAuthSubmit(event)">
          <div>
            <label class="mu" style="display: block; margin-bottom: 4px"
              >البريد الإلكتروني</label
            >
            <input
              type="email"
              id="authEmail"
              required
              dir="ltr"
              placeholder="name@example.com"
            />
          </div>
          <div>
            <label class="mu" style="display: block; margin-bottom: 4px"
              >كلمة السر</label
            >
            <input
              type="password"
              id="authPass"
              required
              dir="ltr"
              placeholder="••••••••"
            />
          </div>
          <div id="authErrMsg" class="auth-err"></div>
          <div style="display: flex; gap: 8px; margin-top: 8px">
            <button
              type="submit"
              class="b p"
              style="flex: 1"
              onclick="authAction = 'login'"
            >
              دخول
            </button>
            <button
              type="submit"
              class="b"
              style="flex: 1"
              onclick="authAction = 'signup'"
            >
              حساب جديد
            </button>
          </div>
          <button
            type="button"
            class="b"
            style="margin-top: 8px"
            onclick="$('authOverlay').style.display = 'none'"
          >
            إلغاء
          </button>
        </form>
      </div>
    </div>

    <div class="w">
      <header>
        <img id="ph" title="اضغط لتغيير الصورة" />
        <div style="flex: 1">
          <h1>Eng: Shady Ashraf</h1>
          <div class="mu" id="dt"></div>
          <div class="mu">اضغط على الصورة لتغييرها</div>
          <div id="syncBadge" class="sync-status synced">متزامن ☁️</div>
        </div>
        <div style="text-align: left">
          <div
            id="userEmailTag"
            class="mu"
            style="margin-bottom: 6px; font-size: 11px"
            dir="ltr"
          ></div>
          <button
            id="authBtn"
            class="b"
            style="padding: 4px 10px; font-size: 12px"
            onclick="toggleAuth()"
          >
            دخول
          </button>
        </div>
      </header>

      <input type="file" id="pf" accept="image/*" hidden />
      <input
        type="file"
        id="backupFile"
        accept=".json"
        hidden
        onchange="processImportBackup(this.files)"
      />

      <div class="cd">
        <div class="mu" id="cl"></div>
        <b id="cb">--:--:--</b>
        <div id="cs"></div>
      </div>

      <nav>
        <button id="n0" onclick="go('today')">اليوم</button>
        <button id="n1" onclick="go('sched')">الجدول</button>
        <button id="n2" onclick="go('subj')">المواد</button>
      </nav>

      <div id="v"></div>

      <!-- Backup Utility Footer -->
      <div
        class="c"
        style="
          margin-top: 20px;
          text-align: center;
          display: flex;
          gap: 10px;
          justify-content: center;
          flex-wrap: wrap;
        "
      >
        <button class="b" onclick="$('backupFile').click()">
          📥 استيراد نسخة احتياطية
        </button>
        <button class="b" onclick="exportBackup()">
          📤 تصدير نسخة احتياطية
        </button>
      </div>
    </div>

    <div id="m">
      <button class="b" onclick="cm()">إغلاق ✕</button>
      <div id="mc"></div>
    </div>

    <script>
      // =========================================================================
      // #CONFIG_SUPABASE : Placeholder credentials
      // =========================================================================
      const SUPABASE_URL = "https://czhcmorfbslveinxgigl.supabase.co";
      const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_AJxqiCu4G3RZa9eaQ2sAfg_umKebqPQ";

      let supabaseClient = null;
      if (
        SUPABASE_URL !== "SUPABASE_URL" &&
        SUPABASE_PUBLISHABLE_KEY !== "SUPABASE_PUBLISHABLE_KEY"
      ) {
        supabaseClient = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_PUBLISHABLE_KEY,
        );
      }

      const DEF_PHOTO = "";

      const SUBJ = [
        "Math 1",
        "Math 0",
        "Electronics",
        "Computer Fundamentals",
        "English",
        "Human Rights",
        "Scientific Thinking",
        "Communication Skills",
      ];

      const DAYS = [
        ["السبت", 6],
        ["الأحد", 0],
        ["الاثنين", 1],
        ["الثلاثاء", 2],
        ["الأربعاء", 3],
        ["الخميس", 4],
        ["الجمعة", 5],
      ];
      const DN = (d) => DAYS.find((x) => x[1] == d)[0];

      let S = {
        sessions: [],
        log: {},
        links: [],
        photo: null,
        definitions: {},
        tasks: {},
      };

      try {
        Object.assign(
          S,
          JSON.parse(localStorage.getItem("shady_study") || "{}"),
        );
      } catch (e) {}

      S.definitions = S.definitions || {};
      S.tasks = S.tasks || {};

      let syncTimer = null;
      let isSyncingActive = false; // Mutex Lock for sync operations
      let needsReSync = false; // Queue flag for changes made during an active sync

      const save = (triggerCloud = true) => {
        try {
          localStorage.setItem("shady_study", JSON.stringify(S));
        } catch (e) {
          alert("تعذر الحفظ؛ مساحة التخزين المحلي قد تكون ممتلئة");
          throw new Error("Local storage quota exceeded");
        }
        if (triggerCloud) {
          triggerAutoSync();
        }
      };

      const uid = () =>
        Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      const esc = (s) =>
        String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const ymd = (d) =>
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0");
      const $ = (id) => document.getElementById(id);

      // IndexedDB Storage Engine (Propagates transactions errors clearly)
      const db = new Promise((res, rej) => {
        try {
          const r = indexedDB.open("shady_files", 1);
          r.onupgradeneeded = () =>
            r.result.createObjectStore("f", { keyPath: "id" });
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        } catch (e) {
          rej(e);
        }
      });

      const tx = async (m, fn) => {
        const d = await db;
        return new Promise((res, rej) => {
          const t = d.transaction("f", m);
          let req = null;
          try {
            req = fn(t.objectStore("f"));
          } catch (e) {
            rej(e);
            return;
          }
          t.oncomplete = () => res(req ? req.result : undefined);
          t.onerror = () =>
            rej(t.error || new Error("IndexedDB Transaction Error"));
          t.onabort = () =>
            rej(t.error || new Error("IndexedDB Transaction Aborted"));
        });
      };

      const putF = (f) => tx("readwrite", (s) => s.put(f)),
        delF = (id) => tx("readwrite", (s) => s.delete(id)),
        allF = () => tx("readonly", (s) => s.getAll());

      $("ph").src = S.photo || DEF_PHOTO;
      $("ph").onclick = () => $("pf").click();
      $("pf").onchange = (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const im = new Image();
        im.onload = () => {
          const s = Math.min(im.width, im.height),
            c = document.createElement("canvas");
          c.width = c.height = 360;
          c.getContext("2d").drawImage(
            im,
            (im.width - s) / 2,
            (im.height - s) / 2,
            s,
            s,
            0,
            0,
            360,
            360,
          );
          S.photo = c.toDataURL("image/jpeg", 0.8);
          try {
            save();
          } catch (err) {
            return;
          }
          $("ph").src = S.photo;
        };
        im.src = URL.createObjectURL(f);
      };

      let tab = "today",
        cur = null,
        hd = new Date(),
        edit = null;
      function go(t) {
        tab = t;
        cur = null;
        draw();
      }
      function draw() {
        ["today", "sched", "subj"].forEach(
          (k, i) => ($("n" + i).className = tab == k ? "on" : ""),
        );
        $("v").innerHTML =
          tab == "today"
            ? vToday()
            : tab == "sched"
              ? vSched()
              : cur
                ? vSubj()
                : vSubjs();
        if (tab == "today") fillDay();
        if (tab == "subj" && cur) {
          fillFiles();
          drawDefinitions();
          drawTasks();
        }
      }

      function nextS() {
        const n = new Date();
        let best = null;
        for (const s of S.sessions) {
          const [h, m] = s.start.split(":").map(Number),
            [eh, em] = s.end.split(":").map(Number);
          for (let o = 0; o < 8; o++) {
            const d = new Date(
              n.getFullYear(),
              n.getMonth(),
              n.getDate() + o,
              h,
              m,
            );
            if (d.getDay() != s.day) continue;
            const e = new Date(
              d.getFullYear(),
              d.getMonth(),
              d.getDate(),
              eh,
              em,
            );
            if (n >= d && n < e) return { s, now: true, left: e - n };
            if (d > n) {
              if (!best || d < best.d) best = { s, d, left: d - n };
              break;
            }
          }
        }
        return best;
      }
      function tick() {
        const n = new Date();
        $("dt").textContent = n.toLocaleDateString("ar-EG", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric",
        });
        const x = nextS();
        if (!x) {
          $("cl").textContent = "لا توجد مواعيد";
          $("cb").textContent = "--:--:--";
          $("cs").textContent = "ضيف مواعيد من تبويب الجدول";
          return;
        }
        let t = Math.floor(x.left / 1000),
          d = Math.floor(t / 86400);
        t %= 86400;
        const p = (v) => String(v).padStart(2, "0");
        $("cl").textContent = x.now
          ? "جارية الآن – المتبقي على انتهائها"
          : "الموعد القادم بعد";
        $("cb").textContent =
          (d ? d + "ي " : "") +
          p(Math.floor(t / 3600)) +
          ":" +
          p(Math.floor((t % 3600) / 60)) +
          ":" +
          p(t % 60);
        $("cs").textContent =
          x.s.subj +
          (x.s.note ? " (" + x.s.note + ")" : "") +
          " – " +
          DN(x.s.day) +
          " " +
          x.s.start +
          " إلى " +
          x.s.end;
      }
      setInterval(tick, 1000);
      tick();

      function vToday() {
        const k = ymd(hd),
          isT = k == ymd(new Date()),
          L = S.log[k] || { done: {}, note: "" };
        const ss = S.sessions
          .filter((s) => s.day == hd.getDay())
          .sort((a, b) => a.start.localeCompare(b.start));
        return `<div class="c ${isT ? "t" : ""}"><div class="r">
          <button class="b" onclick="mv(-1)">‹ اليوم السابق</button>
          <div class="g" style="text-align:center"><h3 style="margin:0">${hd.toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" })}${isT ? " (النهارده)" : ""}</h3></div>
          <button class="b" onclick="mv(1)">اليوم التالي ›</button></div>
          <div style="text-align:center;margin:6px 0"><input type="date" value="${k}" onchange="if(this.value){hd=new Date(this.value+'T12:00');draw()}"> <button class="b" onclick="hd=new Date();draw()">النهارده</button></div></div>
        <div class="c"><h3>مواد اليوم</h3>${
          ss.length
            ? ss
                .map(
                  (s) => `<div class="r">
          <input type="checkbox" ${L.done[s.id] ? "checked" : ""} onchange="tg('${s.id}')">
          <span class="g ${L.done[s.id] ? "done" : ""}">${esc(s.subj)}</span>
          <span class="mu">${s.start} – ${s.end}</span>
          <input style="width:100%" placeholder="هتذاكر إيه؟ (مثلاً Lecture 2)" value="${esc((L.sn || {})[s.id] ?? s.note ?? "")}" oninput="sn('${s.id}',this.value)">
          </div>`,
                )
                .join("")
            : '<div class="mu">مفيش مواد في الجدول لليوم ده</div>'
        }</div>
        <div class="c"><h3>ملاحظات اليوم</h3><textarea oninput="nt(this.value)" placeholder="اكتب اللي ذاكرته أو عملته...">${esc(L.note || "")}</textarea></div>
        <div class="c"><h3>ملفات وروابط أضفتها في اليوم ده</h3><div id="df" class="mu">...</div></div>`;
      }

      const mv = (n) => {
        hd = new Date(hd.getFullYear(), hd.getMonth(), hd.getDate() + n, 12);
        draw();
      };
      const lg = () =>
        S.log[ymd(hd)] || (S.log[ymd(hd)] = { done: {}, note: "" });
      function tg(id) {
        const L = lg();
        L.done[id] = !L.done[id];
        try {
          save();
        } catch (e) {
          L.done[id] = !L.done[id]; // revert
        }
        draw();
      }
      function nt(v) {
        lg().note = v;
        try {
          save();
        } catch (e) {}
      }
      function sn(id, v) {
        const L = lg();
        (L.sn = L.sn || {})[id] = v;
        try {
          save();
        } catch (e) {}
      }
      async function fillDay() {
        const k = ymd(hd);
        try {
          const fs = ((await allF()) || []).filter(
            (f) => ymd(new Date(f.ts)) == k,
          );
          const ls = S.links.filter((l) => ymd(new Date(l.ts)) == k);
          $("df") &&
            ($("df").innerHTML =
              fs.length + ls.length
                ? fs
                    .map((f) => `<div>📎 ${esc(f.subj)}: ${esc(f.name)}</div>`)
                    .concat(
                      ls.map(
                        (l) =>
                          `<div>🔗 ${esc(l.subj)}: <a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.title)}</a></div>`,

      async function enqueueSync(taskFn) {
        if (isSyncingActive) {
          syncQueue = true;
          return;
        }
        isSyncingActive = true;
        try {
          await taskFn();
        } finally {
          isSyncingActive = false;
          if (syncQueue) {
            syncQueue = false;
            enqueueSync(taskFn);
          }
        }
      }

      function triggerAutoSync() {
        if (!currentUser || !supabaseClient || !navigator.onLine) {
          if (!navigator.onLine)
            setSyncStatus("error", "لا يوجد اتصال بالإنترنت");
          return;
        }

        if (syncTimer) clearTimeout(syncTimer);
        syncTimer = setTimeout(() => {
          enqueueSync(performCloudUpload);
        }, 1200);
      }

      async function performCloudUpload() {
        if (!currentUser || !supabaseClient) return;
        if (!navigator.onLine) {
          setSyncStatus("error", "لا يوجد اتصال بالإنترنت");
          return;
        }

        setSyncStatus("syncing");

        try {
          const localFiles = (await allF()) || [];
          const filesMeta = [];
          const activeStoragePaths = new Set();

          for (const fileObj of localFiles) {
            const storagePath = `${currentUser.id}/${fileObj.id}`;
            activeStoragePaths.add(storagePath);

            filesMeta.push({
              id: fileObj.id,
              subj: fileObj.subj,
              name: fileObj.name,
              type: fileObj.type,
              ts: fileObj.ts,
              storage_path: storagePath,
            });

            if (fileObj.blob) {
              const { error: uploadErr } = await supabaseClient.storage
                .from("study-files")
                .upload(storagePath, fileObj.blob, { upsert: true });

              if (uploadErr) {
                throw new Error(
                  `فشل رفع الملف (${fileObj.name}): ${uploadErr.message}`,
                );
              }
            }
          }

          const payload = {
            user_id: currentUser.id,
            data: {
              state: S,
              files: filesMeta,
            },
            updated_at: new Date().toISOString(),
          };

          const { error: dbErr } = await supabaseClient
            .from("study_data")
            .upsert(payload, { onConflict: "user_id" });

          if (dbErr) throw dbErr;

          const syncKey = `shady_cloud_initialized_${currentUser.id}`;
          localStorage.setItem(syncKey, "true");

          try {
            const { data: remoteFileList, error: listErr } =
              await supabaseClient.storage
                .from("study-files")
                .list(currentUser.id);

            if (!listErr && remoteFileList) {
              const pathsToRemove = remoteFileList
                .map((f) => `${currentUser.id}/${f.name}`)
                .filter((p) => !activeStoragePaths.has(p));

              if (pathsToRemove.length > 0) {
                await supabaseClient.storage
                  .from("study-files")
                  .remove(pathsToRemove);
              }
            }
          } catch (cleanErr) {
            console.error("Storage Cleanup Error:", cleanErr);
          }

          setSyncStatus("synced");
        } catch (err) {
          console.error("Cloud Upload Error:", err);
          setSyncStatus("error", err.message);
        }
      }

      async function initCloudDataFlow() {
        if (!currentUser || !supabaseClient) return;

        if (!navigator.onLine) {
          setSyncStatus("error", "لا يوجد اتصال بالإنترنت");
          return;
        }

        const syncKey = `shady_cloud_initialized_${currentUser.id}`;

        setSyncStatus("syncing");

        try {
          const { data, error } = await supabaseClient
            .from("study_data")
            .select("*")
            .eq("user_id", currentUser.id)
            .maybeSingle();

          if (error) throw error;

          // لو الجهاز سبق واتصل بالحساب، لا تستبدل بياناته تلقائيًا.
          if (localStorage.getItem(syncKey) === "true") {
            setSyncStatus("synced");
            return;
          }

          const hasLocal = await checkLocalDataExists();

          if (data && data.data) {
            if (hasLocal) {
              const useCloud = confirm(
                "توجد بيانات على السحابة وبيانات على هذا الجهاز.\n\nموافق: تحميل بيانات السحابة واستبدال البيانات المحلية.\nإلغاء: الاحتفاظ بالبيانات المحلية ورفعها للسحابة.",
              );

              if (useCloud) {
                await restoreCloudToLocal(
                  data.data.state || {},
                  data.data.files || [],
                );
              } else {
                await performCloudUpload();
              }
            } else {
              await restoreCloudToLocal(
                data.data.state || {},
                data.data.files || [],
              );
            }
          } else if (hasLocal) {
            await performCloudUpload();
          } else {
            setSyncStatus("synced");
          }

          localStorage.setItem(syncKey, "true");
        } catch (err) {
          console.error("Init Cloud Data Error:", err);
          setSyncStatus("error", err.message);
        }
      }

      function parseRawBlobData(raw, type = "application/octet-stream") {
        if (!raw) return null;
        if (raw instanceof Blob) return raw;
        if (raw instanceof ArrayBuffer) return new Blob([raw], { type });
        if (ArrayBuffer.isView(raw)) {
          return new Blob(
            [raw.buffer.slice(raw.byteOffset, raw.byteOffset + raw.byteLength)],
            { type },
          );
        }

        if (typeof raw === "object" && Array.isArray(raw.data)) {
          return new Blob([new Uint8Array(raw.data)], { type });
        }

        if (typeof raw === "string") {
          const str = raw.trim();
          if (!str) return null;
          try {
            const base64Data = str.includes(",") ? str.split(",")[1] : str;
            const binaryStr = atob(base64Data);
            const len = binaryStr.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
              bytes[i] = binaryStr.charCodeAt(i);
            }
            return new Blob([bytes], { type });
          } catch (e) {
            return null;
          }
        }
        return null;
      }

          // Take snapshots for safe rollback if import fails midway
          const backupS = JSON.parse(JSON.stringify(S));
          let backupFiles = [];
          try {
            backupFiles = (await allF()) || [];
          } catch (err) {}

          const currentLSBackup = {};
          for (let i = 0; i < localStorage.length; i++) {
            const k = localStorage.key(i);
            if (k) currentLSBackup[k] = localStorage.getItem(k);
          }

          let importedFilesCount = 0;
          let failedFilesCount = 0;
          let importedRecords = 0;

          try {
            const backup = JSON.parse(e.target.result);

            if (!backup || typeof backup !== "object") {
              throw new Error("ملف النسخة الاحتياطية تالف أو غير صالح.");
            }

            // 1. Process localStorage safely (preserving current Supabase session keys)
            if (
              backup.localStorage &&
              typeof backup.localStorage === "object"
            ) {
              const keys = Object.keys(backup.localStorage);
              for (const k of keys) {
                if (k.startsWith("sb-") || k.includes("supabase")) continue;

                if (k === "shady_study") {
                  try {
                    const parsedS = JSON.parse(backup.localStorage.shady_study);
                    S = Object.assign(S, parsedS);
                    importedRecords =
                      (S.sessions || []).length + (S.links || []).length;
                  } catch (err) {
                    throw new Error(
                      "بيانات shady_study داخل النسخة الاحتياطية تالفة.",
                    );
                  }
                } else {
                  localStorage.setItem(k, backup.localStorage[k]);
                }
              }
            }

            // 2. Process IndexedDB files with strict error reporting
            if (backup.indexedDB && Array.isArray(backup.indexedDB)) {
              for (const item of backup.indexedDB) {
                const blobObj = parseRawBlobData(
                  item.blob,
                  item.type || "application/octet-stream",
                );
                if (!blobObj || blobObj.size === 0) {
                  failedFilesCount++;
                  continue;
                }

                try {
                  await putF({
                    id: item.id || uid(),
                    subj: item.subj || SUBJ[0],
                    name: item.name || "File",
                    type: item.type || blobObj.type,
                    blob: blobObj,
                    ts: item.ts || Date.now(),
                  });
                  importedFilesCount++;
                } catch (err) {
                  failedFilesCount++;
                }
              }
            }

            if (failedFilesCount > 0) {
              throw new Error(
                `فشل استيراد ${failedFilesCount} ملفات بسبب تلف البيانات أو عدم توافق الصيغة.`,
              );
            }

            try {
              save(true);
            } catch (lsSaveErr) {
              throw new Error(
                "فشل حفظ البيانات المستوردة بسبب امتلاء مساحة التخزين المحلي.",
              );
            }

            draw();
            if ($("ph") && S.photo) $("ph").src = S.photo;

            alert(
              `تم استيراد النسخة الاحتياطية بنجاح!\n- العناصر والروابط: ${importedRecords}\n- الملفات المستوردة بنجاح: ${importedFilesCount}\n- الملفات الفاشلة: ${failedFilesCount}`,
            );
          } catch (err) {
            // ROLLBACK on any import failure
            try {
              S = backupS;
              localStorage.clear();
              for (const k in currentLSBackup) {
                localStorage.setItem(k, currentLSBackup[k]);
              }
              if ($("ph") && S.photo) $("ph").src = S.photo;
            } catch (rbErr) {}

            alert(
              "فشل عملية الاستيراد وتم التراجع عن التغييرات لحماية بياناتك: " +
                err.message,
            );
            draw();
          }
        };
        reader.readAsText(file);
      }

      draw();
    </script>
  </body>
</html>
